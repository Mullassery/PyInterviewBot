[package]
name = "voice-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[features]
local-neural = ["dep:sherpa-onnx"]

[dependencies.sherpa-onnx]
version = "2.0.0"
optional = true

[dev-dependencies]
axum = { version = "0.8.9", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }

[[example]]
name = "neural_smoke"
required-features = ["local-neural"]
