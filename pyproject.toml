[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[project]
name = "PyInterviewBot"
version = "0.1.2"
description = "Multi-channel AI interview platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}]
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ai-service/tests"]
pythonpath = ["ai-service/src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "D", "DTZ", "T20", "C90", "Q", "RUF"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D205", "D212", "D213", "D214", "D105", "D100", "D203", "E501", "E731", "E741"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "websockets>=17.1",
]

[tool.uv.sources]
pyinterviewbot_ai = { path = "ai-service/src", editable = true }
