name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: gateway (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  ai-service:
    name: ai-service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: import sanity check
        run: uv run python -c "from pyinterviewbot_ai.main import app; print('import OK')"

      - name: pytest (deterministic mock providers)
        run: uv run --group dev python -m pytest -q

      # ai-service/scripts/e2e_ws_test.py is the live integration test. It
      # needs Ollama serving qwen2.5:7b-instruct and a downloaded Piper voice,
      # which this runner does not have, so it remains a local test.

  candidate-client:
    name: candidate-client (JS/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candidate-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: candidate-client/package-lock.json

      - name: npm ci
        run: npm ci

      - name: type check
        run: npx tsc --noEmit

      - name: build
        run: npm run build
