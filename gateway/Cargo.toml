[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
local-neural = ["voice-runtime/local-neural"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.12.1"
earshot = "1.2.2"
futures-util = "0.3.34"
hmac = "0.12.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha1 = "0.10.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
voice-runtime = { path = "../voice-runtime" }
